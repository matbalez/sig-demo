[package]
name = "sig-demo-gdk-native-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "AGPL-3.0-only"
publish = false

# Build the SDK package itself, whose upstream crate already produces a cdylib.
# This package exists only to pin dependencies and retain our provider patch.
[dependencies]
goose-sdk = { version = "=0.1.0-alpha.12", features = ["uniffi"] }

[patch.crates-io]
goose-provider-types = { path = "vendor/goose-provider-types" }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
