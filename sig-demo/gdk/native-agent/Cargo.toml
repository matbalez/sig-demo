[package]
name = "sig-demo-native-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "sig_demo_agent"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
goose-agent = "=0.1.0-alpha.12"
goose-provider-types = "=0.1.0-alpha.12"
goose-providers = { version = "=0.1.0-alpha.12", features = ["rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.4.1", default-features = false, features = ["server", "schemars", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uniffi = "=0.32.2"

[patch.crates-io]
goose-provider-types = { path = "../native/vendor/goose-provider-types" }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
